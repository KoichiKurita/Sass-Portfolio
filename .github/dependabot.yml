# Dependabot：依存関係の更新 PR を自動で作成する
version: 2

updates:
  # ---------------------------------
  # npm パッケージ（package.json / package-lock.json）
  # ---------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # 公開直後のバージョンはすぐに取り込まない（乗っ取られたパッケージの混入対策）
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels: [chore]
    commit-message:
      prefix: 'chore(deps)'
    # minor / patch はまとめて 1 つの PR にする（major は互換性確認のため個別）
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # husky の v9 への移行は Issue「husky v9 + lint-staged」で対応するため除外
      - dependency-name: husky
        update-types: ['version-update:semver-major']

  # ---------------------------------
  # GitHub Actions（.github/workflows/*.yml の uses:）
  # ---------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    labels: [ci]
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns: ['*']
