name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions 画面から手動実行できるようにする

# 既定はすべて読み取り専用（最小権限）。書き込みが必要なジョブだけ個別に許可する
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い CI は取り消す（無駄な実行を減らす）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------
  # 品質チェック：PR でも main でも毎回実行する
  # ---------------------------------
  ci:
    name: Lint / Build / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # ローカルと同じ Node バージョンを使う
          cache: npm

      - name: Install dependencies
        run: npm ci # package-lock.json どおりに厳密にインストールする

      - name: Lint (JS / SCSS)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (with coverage)
        run: npm run test:coverage # カバレッジがしきい値を下回ると失敗する

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # main への push のときだけ、ビルド結果を Pages 用の成果物として保存する
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # ---------------------------------
  # E2E テスト：本番と同じビルド結果を、実際のブラウザで操作して確認する
  # （アクセシビリティの自動検査も含む）
  # ---------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # 失敗したときに、操作の記録（trace）付きのレポートをダウンロードできるようにする
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------
  # デプロイ：main のときだけ、品質チェックと E2E テストが通った後に実行する
  # ---------------------------------
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Pages へのデプロイ
      id-token: write # デプロイ時の本人確認（OIDC）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # デプロイの途中で取り消さない
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
