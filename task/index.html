<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management App | Koichi Kurita Portfolio</title>
    <meta
      name="description"
      content="localStorage と状態管理で作ったタスク管理アプリ。キーボード操作・スクリーンリーダーにも対応しています。"
    />
    <link rel="canonical" href="%VITE_SITE_URL%/task/" />

    <!-- アイコン（タブ・ブックマーク・スマホのホーム画面） -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f0f1a" />

    <!-- OGP：SNS やチャットで URL を共有したときに表示されるカード -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koichi Kurita Portfolio" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="%VITE_SITE_URL%/task/" />
    <meta property="og:title" content="Task Management App | Koichi Kurita Portfolio" />
    <meta
      property="og:description"
      content="localStorage と状態管理で作ったタスク管理アプリ。キーボード操作・スクリーンリーダーにも対応しています。"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Koichi Kurita - Frontend Engineer Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 保存済みのテーマを描画前に反映する（module にしない：理由は theme-init.js を参照） -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <a class="c-skip-link" href="#main">本文へスキップ</a>

    <header class="l-header">
      <div class="l-header__logo">Koichi Kurita</div>
      <nav class="l-header__nav" aria-label="メイン">
        <a href="../">Home</a>
        <button
          id="theme-toggle"
          class="c-theme-toggle"
          type="button"
          aria-label="ダークモード"
          aria-pressed="true"
        >
          <span class="c-theme-toggle__icon" aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="p-hero p-hero--small">
        <div class="p-hero__inner">
          <h1 class="p-hero__title">Task Management App</h1>
          <p class="p-hero__subtitle">CRUD × localStorage × State Management</p>
        </div>
      </section>

      <section class="container p-task">
        <div class="c-card">
          <noscript>
            <p class="p-task__noscript">
              このアプリを使うには、ブラウザの JavaScript を有効にしてください。
            </p>
          </noscript>
          <form id="task-form" class="p-task__input">
            <label for="task-input" class="u-visually-hidden">新しいタスク</label>
            <input
              type="text"
              id="task-input"
              name="task"
              placeholder="Add new task"
              autocomplete="off"
            />
            <button id="add-task" class="c-button" type="submit">Add</button>
          </form>

          <div class="p-task__filter" role="group" aria-label="表示するタスクの絞り込み">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>

          <ul id="task-list" class="p-task__list" aria-label="タスク一覧"></ul>

          <!-- 操作結果をスクリーンリーダーに伝える（画面には表示しない） -->
          <p id="task-status" class="u-visually-hidden" role="status"></p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/js/task/index.js"></script>
  </body>
</html>
